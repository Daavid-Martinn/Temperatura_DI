<ion-content [fullscreen]="true">
  <ion-grid class="ion-no-padding">
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-md="8" size-lg="6" class="ion-padding">
        
        <h1 class="ion-text-center ion-text-light" style="margin-top: 40px;">
          Weather <span style="font-weight: bold;">Sweet</span>
        </h1>

        <app-search-bar (search)="onSearch($event)" (gps)="onGps()"></app-search-bar>

        <div *ngIf="loading" class="ion-text-center ion-padding ion-margin-top">
          <ion-spinner name="crescent" color="light"></ion-spinner>
        </div>

        <app-current-weather 
          *ngIf="weatherData && !loading" 
          [current]="weatherData.current">
        </app-current-weather>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
