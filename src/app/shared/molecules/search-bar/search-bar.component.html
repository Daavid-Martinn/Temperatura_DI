<div class="search-container">

  <ion-button fill="clear" (click)="triggerGps()" class="icon-btn">
    <ion-icon slot="icon-only" name="locate"></ion-icon>
  </ion-button>

  <input type="text" placeholder="Buscar ciudad..." [(ngModel)]="searchTerm" (keyup.enter)="triggerSearch()"
    class="custom-input native-input">

  <ion-button fill="clear" (click)="triggerSearch()" class="icon-btn">
    <ion-icon slot="icon-only" name="search"></ion-icon>
  </ion-button>

</div>
